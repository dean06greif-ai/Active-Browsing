name: Build und Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q tests

      - name: Selbsttest (Python, echte Win32-Aufrufe)
        run: python -m awaketoggle --selftest

      - name: exe bauen
        run: ./tools/build.ps1

      - name: Selbsttest (exe)
        run: |
          $p = Start-Process -FilePath dist/AwakeToggle.exe -ArgumentList "--selftest" -Wait -PassThru
          Get-Content (Join-Path $env:TEMP "AwakeToggle-selftest.txt")
          if ($p.ExitCode -ne 0) { throw "Selbsttest der exe fehlgeschlagen (Exitcode $($p.ExitCode))" }

      - name: Prüfsumme
        run: |
          $h = (Get-FileHash dist/AwakeToggle.exe -Algorithm SHA256).Hash.ToLower()
          "$h  AwakeToggle.exe" | Out-File -Encoding ascii dist/AwakeToggle.exe.sha256
          Get-Content dist/AwakeToggle.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AwakeToggle
          path: |
            dist/AwakeToggle.exe
            dist/AwakeToggle.exe.sha256

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AwakeToggle.exe
            dist/AwakeToggle.exe.sha256
          generate_release_notes: true
